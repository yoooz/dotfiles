# workspace-write サンドボックスで、プロジェクト外に書き込みを許可するディレクトリ。
# 読み取りは read-only サンドボックスでも全ディスク可能なので、ここは書き込み用。
# Codex は `~` を展開するが `$HOME` などの環境変数は展開しない（codex-cli 0.153.4 で確認）。
[sandbox_workspace_write]
writable_roots = ["~/yoooz_vault"]

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/yoooz/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
